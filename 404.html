<!DOCTYPE html>
<html>
 
<head>
  <meta
    http-equiv="Content-Security-Policy"
    content="script-src 'nonce-aem' 'strict-dynamic' 'unsafe-inline' http: https:; base-uri 'self'; object-src 'none';"
    move-to-http-header="true"
  >
  <title>Page not found</title>
  <script nonce="aem" type="text/javascript">
    window.isErrorPage = true;
    window.errorCode = '404';
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta property="og:title" content="Page not found">
  <script nonce="aem" src="/scripts/scripts.js" type="module"></script>

  <script nonce="aem" type="module">
    import { sampleRUM } from '/scripts/aem.js';
    sampleRUM('404', { source: document.referrer });
  </script>
  <link rel="stylesheet" href="/styles/styles.css">
  <style>
    main.error .breadcrumb,
    main.error nav.breadcrumb,
    main.error .breadcrumbs {
      display: none !important;
    }
 
    main.error {
      min-height: calc(100vh - var(--nav-height));
      background: #f4f4f4;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
    }
 
    .error-wrapper {
      text-align: center;
      max-width: 720px;
      width: 100%;
    }
 
    .error-number {
      font-size: 180px;
      font-weight: 700;
      color: rgba(0, 0, 0, 0.08);
      line-height: 1;
      margin-bottom: 20px;
    }
 
    .error-title {
      font-size: 40px;
      font-weight: 500;
      color: #111;
      margin: 20px 0 16px;
    }
 
    .error-description {
      font-size: 20px;
      color: #666;
      line-height: 1.6;
      margin-bottom: 40px;
    }
 
 
    .error-button {
      display: inline-block;
      background: #f0b24c;
      color: #111;
      padding: 16px 36px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 16px;
      font-weight: 500;
    }
 
    .error-button:hover {
      background: #e5a53c;
    }
 
    .error-divider {
      width: 100%;
      height: 2px;
      background: #7ec0da;
      margin: 50px 0 30px;
    }
 
    .error-links {
      display: flex;
      justify-content: center;
      gap: 50px;
      flex-wrap: wrap;
    }
 
    .error-links a {
      text-decoration: none;
      font-size: 16px;
      font-weight: 500;
      color: #f5a623;
    }
 
    .error-links a::after {
      content: "›";
      margin-left: 8px;
    }
 
  </style>
  <link rel="stylesheet" href="/styles/lazy-styles.css">
</head>
 
<body>
  <header></header>
  <main class="error">
    <div class="error-wrapper">
 
      <div class="error-number">404</div>
 
        <h2 class="error-title">
          This page is no longer available.
        </h2>
 
        <p class="error-description">
          The content you’re looking for may have been updated or
          relocated as part of our continued growth.
        </p>
 
      <div class="button-container">
        <a href="/en/" class="error-button">
          Return to Homepage
        </a>
      </div>
 
      <div class="error-divider"></div>
 
      <div class="error-links">
        <a href="/">INVESTOR RELATIONS</a>
        <a href="/">SUSTAINABILITY</a>
        <a href="/">CAREERS</a>
      </div>
 
    </div>
  </main>
  <footer></footer>
</body>
 
</html>
